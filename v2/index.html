<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./vendor/normalize.css" />
    <link rel="stylesheet" href="./style.css" />
    <title>График отпусков</title>
</head>

<body class="page">
    <script>
        if (!sessionStorage.getItem('vacationAuth')) {
            window.location.replace('login.html');
        }
    </script>

    <div class="container">
        <header class="header">
            <div class="header__brand">
                <div class="header__logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 256 256">
                        <rect width="256" height="256" fill="none" />
                        <rect x="32" y="48" width="192" height="160" rx="8" opacity="0.2" fill="#ffffff" />
                        <rect x="32" y="48" width="192" height="160" rx="8" fill="none" stroke="#ffffff"
                            stroke-linecap="round" stroke-linejoin="round" stroke-width="16" />
                        <line x1="176" y1="24" x2="176" y2="56" fill="none" stroke="#ffffff" stroke-linecap="round"
                            stroke-linejoin="round" stroke-width="16" />
                        <line x1="80" y1="24" x2="80" y2="56" fill="none" stroke="#ffffff" stroke-linecap="round"
                            stroke-linejoin="round" stroke-width="16" />
                        <line x1="32" y1="88" x2="224" y2="88" fill="none" stroke="#ffffff" stroke-linecap="round"
                            stroke-linejoin="round" stroke-width="16" />
                        <path d="M176,136a24,24,0,1,1-24-24A24,24,0,0,1,176,136Z" opacity="0.2" fill="#ffffff" />
                        <path d="M128,136a24,24,0,1,1-24-24A24,24,0,0,1,128,136Z" opacity="0.2" fill="#ffffff" />
                        <path d="M80,184a24,24,0,1,1-24-24A24,24,0,0,1,80,184Z" opacity="0.2" fill="#ffffff" />
                    </svg>
                </div>
                <div class="header__titles">
                    <h1 class="header__title" id="header-title">График отпусков</h1>
                    <span class="header__badge" id="header-year"></span>
                </div>
            </div>

            <div class="header__actions">
                <button type="button" class="user-chip" id="btn-profile" title="Профиль сотрудника">
                    <span class="user-chip__avatar" id="user-chip-avatar"></span>
                    <span class="user-chip__text">
                        <span class="user-chip__name" id="user-chip-name"></span>
                        <span class="user-chip__sub" id="user-chip-sub"></span>
                    </span>
                </button>
                <select id="view-month" class="year-select year-select_view"
                    title="Показать отпуска за месяц"></select>
                <select id="year-select" class="year-select"></select>
                <button type="button" class="btn btn_logout" id="btn-logout">Выйти</button>
            </div>
        </header>

        <main class="content">
            <section class="content-side">
                <div class="side-header">
                    <h2 class="side-title">Сотрудники</h2>
                    <div style="display: flex; gap: 8px;">
                        <button type="button" class="btn_icon btn_manage-groups" id="btn-manage-groups"
                            title="Управление группами">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="3"></circle>
                                <path
                                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                                </path>
                            </svg>
                        </button>
                        <button type="button" class="btn btn_add" id="btn-add-user">+ Добавить</button>
                    </div>
                </div>

                <div id="users-container"></div>

                <div class="side-footer">
                    <button type="button" class="btn_small" id="btn-export-excel">Выгрузить в Excel</button>
                    <button type="button" class="btn_link" id="btn-reset">Сбросить всё</button>
                </div>
            </section>

            <section class="content-main">
                <div class="view-banner" id="view-banner" hidden>
                    <span class="view-banner__text" id="view-banner-text"></span>
                    <button type="button" class="view-banner__reset" id="view-banner-reset">Показать весь год</button>
                </div>
                <div class="calendar" id="calendar-container"></div>
            </section>
        </main>
    </div>

    <!-- Основной попап для календаря -->
    <div class="popup">
        <div class="popup__container" id="popup__container">
            <h2 class="popup__title">Дата</h2>
            <div class="popup__content"></div>
            <button type="button" class="popup__close-button" aria-label="Закрыть" title="Закрыть"></button>
        </div>
    </div>

    <!-- НОВЫЙ ПОПАП: Управление группами -->
    <div class="popup" id="groups-popup">
        <div class="popup__container" style="width: 380px; max-width: 90%;">
            <h2 class="popup__title">Управление группами</h2>
            <div class="popup__content" id="groups-popup-content"
                style="max-height: 60vh; overflow-y: auto; padding-right: 4px;">
                <!-- Здесь будет список групп -->
            </div>
            <button type="button" class="btn btn_add" id="btn-create-group" style="width: 100%; margin-top: 8px;">
                + Создать группу
            </button>
            <button type="button" class="popup__close-button" id="groups-popup-close" aria-label="Закрыть"
                title="Закрыть"></button>
        </div>
    </div>

    <!-- Попап профиля сотрудника -->
    <div class="popup" id="profile-popup">
        <div class="popup__container popup__container_profile">
            <h2 class="popup__title" id="profile-popup-title">Профиль</h2>
            <div class="popup__content" id="profile-popup-content"></div>
            <div class="profile-footer">
                <div class="profile-norm" id="profile-norm"></div>
                <div class="popup__actions">
                    <button type="button" class="btn btn_danger" id="profile-popup-delete" hidden>Удалить профиль</button>
                    <button type="button" class="btn btn_small" id="profile-popup-cancel">Закрыть</button>
                    <button type="button" class="btn btn_add" id="profile-popup-save">Сохранить</button>
                </div>
            </div>
            <button type="button" class="popup__close-button" id="profile-popup-close" aria-label="Закрыть"
                title="Закрыть"></button>
        </div>
    </div>

    <!-- Попап выгрузки в Excel -->
    <div class="popup" id="export-popup">
        <div class="popup__container popup__container_export">
            <h2 class="popup__title">Выгрузка в Excel</h2>
            <div class="popup__content" id="export-popup-content">
                <div class="export-form">
                    <div class="export-form__group">
                        <span class="export-form__label">Кого выгружать</span>
                        <label class="export-choice">
                            <input type="radio" name="export-scope" value="all" checked /> Все сотрудники
                        </label>
                        <label class="export-choice">
                            <input type="radio" name="export-scope" value="group" /> Только группу
                        </label>
                        <select class="year-select export-form__select" id="export-group" disabled></select>
                        <label class="export-choice">
                            <input type="radio" name="export-scope" value="picked" /> Только выбранных
                        </label>
                        <div class="export-picked" id="export-picked" hidden>
                            <input type="text" class="combo__input" id="export-search" placeholder="Поиск по ФИО" />
                            <div class="export-picked__list" id="export-picked-list"></div>
                        </div>
                    </div>

                    <div class="export-form__group">
                        <span class="export-form__label">Месяцы</span>
                        <select class="year-select export-form__select" id="export-month"></select>
                    </div>

                    <label class="export-choice">
                        <input type="checkbox" id="export-skip-empty" /> Пропускать сотрудников без отпусков
                    </label>
                </div>

                <div class="export-summary" id="export-summary"></div>
            </div>
            <div class="popup__actions">
                <button type="button" class="btn btn_small" id="export-cancel">Отмена</button>
                <button type="button" class="btn btn_add" id="export-run">Выгрузить</button>
            </div>
            <button type="button" class="popup__close-button" id="export-close" aria-label="Закрыть"
                title="Закрыть"></button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <script type="module" src="./firebase-config.js"></script>
    <script type="module" src="./scripts/app.js"></script>
</body>

</html>
